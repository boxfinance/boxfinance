<!DOCTYPE html>
<html>
<head>
  <title>Investment Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- HEADER -->
<div class="header">
  <h2>Investment Account</h2>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="dashboard">

  <!-- Welcome -->
  <div class="welcome">
    <img src="https://i.pravatar.cc/150?img=12" alt="Profile">
    <h3>Welcome, <span id="username"></span></h3>
  </div>

  <!-- Capital & Profit -->
  <div class="card-row">
    <div class="card">
      <h3>Invested Capital</h3>
      <div class="card-value">$250</div>
    </div>

    <div class="card">
      <h3>Accumulated Profits</h3>
      <div class="card-value blue" id="profits"></div>
    </div>
  </div>

  <!-- Total Value -->
  <div class="total-card">
    <h2>Total Account Value</h2>
    <div class="total-value" id="total"></div>
    <div class="profit">+756.10% ▲</div>
  </div>

  <!-- Withdraw BELOW total -->
  <div class="withdraw-container">
    <button class="withdraw-btn">Withdraw</button>
  </div>

</div>

<script>
  const name = localStorage.getItem("name");
  const balance = parseFloat(localStorage.getItem("balance"));

  if (!name) {
    window.location.href = "login.html";
  }

  document.getElementById("username").innerText = name;

  const capital = 250;
  const profits = balance - capital;

  document.getElementById("total").innerText = "$" + balance.toFixed(2);
  document.getElementById("profits").innerText = "$" + profits.toFixed(2);

  function logout() {
    localStorage.clear();
    window.location.href = "login.html";
  }
</script>

</body>
</html>
